services:
  - type: web
    name: staff-performance-tracker
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    # FIX: Explicitly use pms_project instead of app
    startCommand: gunicorn pms_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true 
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

