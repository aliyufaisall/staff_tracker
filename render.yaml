services:
  - type: web
    name: staff-performance-tracker
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn pms_project.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/db.sqlite3

